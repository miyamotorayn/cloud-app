name: Cloud App CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cloud-app:latest

  deploy:
    name: Deploy Application
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Run Docker Container
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/cloud-app:latest
          docker run -d -p 5000:5000 --name cloud-app ghcr.io/${{ github.repository_owner }}/cloud-app:latest
          sleep 5
          curl --fail http://localhost:5000